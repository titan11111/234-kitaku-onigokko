<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>帰宅鬼ごっこ 〜交番までダッシュ〜</title>
<style>
  :root{
    --ink:#0a0d1a; --panel:#11162b; --line:#7f8cc4; --hi:#ffe066; --danger:#ff4d5e; --ok:#6ee7a0;
  }
  /* --- iOS鉄則: タップハイライト/長押しメニュー/選択/ズームを全面的に殺す --- */
  *,*::before,*::after{
    box-sizing:border-box;margin:0;padding:0;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
  }
  html,body{
    height:100%;height:-webkit-fill-available;
    background:#05070f;overflow:hidden;overscroll-behavior:none;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",monospace;color:#e8ecff;
    touch-action:manipulation;              /* body は manipulation */
  }
  #game{touch-action:none;position:relative;z-index:0} /* canvas は none の2段構え。重なりはDOM順ではなくz-index */
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070f}
  #game{
    width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  #hud{position:absolute;inset:0;pointer-events:none;font-size:13px;letter-spacing:.04em}
  .box{
    background:rgba(10,14,30,.78);border:2px solid var(--line);
    box-shadow:0 0 0 2px #05070f, inset 0 0 0 1px #2b3560;
    padding:6px 9px;
  }
  #topLeft{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top))}
  #topCenter{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;min-width:190px}
  #state{font-weight:bold}
  .safe{color:var(--ok)} .warn{color:var(--hi)} .chase{color:var(--danger)}
  #botLeft{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));width:212px}
  .barwrap{height:10px;border:1px solid #47528c;background:#080b18;margin-top:3px}
  .bar{height:100%;width:100%;background:linear-gradient(90deg,#ffe066,#ffa63d);transition:width .08s linear}
  #breathRow{display:none;margin-top:6px}
  #breathBar{background:linear-gradient(90deg,#8fd9ff,#4aa3ff)}
  #presenceBar{background:linear-gradient(90deg,#6ee7a0,#ff4d5e)}
  #botRight{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));text-align:center}
  #map{width:132px;height:132px;display:block;image-rendering:pixelated;background:#070a14}
  #hint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);text-align:center;display:none}
  #overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:20px;
  }
  .blink{animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:.25}}
  /* ===== 仮想コントローラ（DOMオーバーレイ／Pointer Events） ===== */
  #touch{position:absolute;inset:0;pointer-events:none;display:none;z-index:6;touch-action:none}
  #touch *{touch-action:none}
  #stick{
    position:absolute;
    left:calc(22px + env(safe-area-inset-left));
    bottom:calc(22px + env(safe-area-inset-bottom));
    width:min(38vw,132px);height:min(38vw,132px);border-radius:50%;
    border:1px solid rgba(0,229,255,.45);
    background:radial-gradient(circle at 50% 50%,rgba(0,229,255,.10),rgba(8,12,28,.55) 70%);
    box-shadow:0 0 18px rgba(0,229,255,.18),inset 0 0 22px rgba(0,229,255,.08);
    pointer-events:auto;
  }
  #stick::before{
    content:"";position:absolute;inset:22%;border-radius:50%;
    border:1px dashed rgba(0,229,255,.25);pointer-events:none;
  }
  #knob{
    position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;
    border-radius:50%;background:radial-gradient(circle at 40% 35%,#bdf4ff,#2b7fa8 70%,#0d2b3c);
    box-shadow:0 0 14px rgba(0,229,255,.55);pointer-events:none;
  }
  .tbtn{
    position:absolute;pointer-events:auto;
    width:min(20vw,74px);height:min(20vw,74px);border-radius:50%;
    border:1px solid rgba(255,45,120,.5);
    background:radial-gradient(circle at 50% 40%,rgba(255,45,120,.16),rgba(14,8,24,.72) 70%);
    box-shadow:0 0 16px rgba(255,45,120,.2),inset 0 0 18px rgba(255,45,120,.08);
    color:#ffd9e4;font-size:12px;letter-spacing:.06em;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;
  }
  .tbtn.press{background:radial-gradient(circle at 50% 40%,rgba(255,45,120,.5),rgba(60,8,30,.9) 70%);
    box-shadow:0 0 26px rgba(255,45,120,.55);color:#fff;transform:scale(.94)}
  #tDash{right:calc(104px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom))}
  #tHide{right:calc(20px + env(safe-area-inset-right));bottom:calc(92px + env(safe-area-inset-bottom))}
  .lookbtn{
    position:absolute;pointer-events:auto;width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(0,229,255,.4);background:rgba(8,14,30,.6);color:#9fe9ff;
    font-size:16px;display:flex;align-items:center;justify-content:center;
  }
  .lookbtn.press{background:rgba(0,229,255,.3);color:#fff}
  #tLookL{right:calc(150px + env(safe-area-inset-right));bottom:calc(112px + env(safe-area-inset-bottom))}
  #tLookR{right:calc(96px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom))}
  /* ===== システムバー（ミュート／ポーズ）= 常時表示 ===== */
  #sysbar{
    position:absolute;z-index:30;display:flex;gap:8px;
    right:calc(12px + env(safe-area-inset-right));
    top:calc(12px + env(safe-area-inset-top));
    pointer-events:auto;z-index:30;
  }
  .sysbtn{
    width:40px;height:40px;border:1px solid rgba(239,230,216,.32);
    background:rgba(5,6,10,.72);color:#cfc6ba;font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .sysbtn:active,.sysbtn.press{background:rgba(239,230,216,.14);color:#fff}
  .sysbtn.off{border-color:rgba(154,32,48,.7);color:#c45;box-shadow:none}
  @media (max-height:560px){
    #stick{width:106px;height:106px}
    .tbtn{width:60px;height:60px;font-size:11px}
  }
  /* パッド表示時はHUDをプレイ領域から外す。
     スタミナ／気配をスティック上（画面下寄り）へ上げると、三人称の主人公と重なる。 */
  body.touchmode #botLeft{
    top:calc(68px + env(safe-area-inset-top));
    bottom:auto;
    width:min(42vw,148px);
    font-size:11px;
    padding:5px 7px;
    background:rgba(10,14,30,.62);
  }
  body.touchmode #botLeft .barwrap{height:7px;margin-top:2px}
  body.touchmode #botRight{
    top:calc(76px + env(safe-area-inset-top));bottom:auto;
  }
  body.touchmode #map{width:96px;height:96px}
  body.touchmode #hint{bottom:calc(196px + env(safe-area-inset-bottom))}
  body.touchmode #topCenter{
    min-width:0;
    max-width:min(52vw,220px);
  }
  @media (max-height:560px){
    body.touchmode #botLeft{
      top:calc(44px + env(safe-area-inset-top));
      width:min(38vw,132px);
      padding:4px 6px;
    }
  }
  .small{font-size:11px;color:#8a8680}

  /* ==========================================================
     パンク × 冷たい恐怖（タイトル／エンディング／ポーズ）
     ========================================================== */
  #overlay{
    --bone:#efe6d8; --ice:#9aa8b4; --blood:#9a2030; --ink:#05060a;
    background:
      radial-gradient(90% 70% at 50% 118%, rgba(90,8,18,.38), transparent 58%),
      radial-gradient(120% 80% at 50% -30%, rgba(186,198,210,.07), transparent 52%),
      var(--ink);
    overflow:hidden;z-index:20;
  }
  #overlay::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 1px,transparent 1px 7px);
    opacity:.7;
  }
  #overlay::after{
    content:"";position:absolute;inset:-20%;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(-18deg,transparent 0 46px,rgba(154,32,48,.05) 46px 48px);
    animation:grain 9s steps(2) infinite;
  }
  @keyframes grain{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,6px)}}
  #overlay.dead{
    background:
      radial-gradient(120% 90% at 50% 50%, transparent 22%, rgba(90,0,14,.62) 78%, rgba(12,0,2,.96) 100%),
      #090204;
    animation:heart 1.6s ease-in-out infinite;
  }
  @keyframes heart{
    0%,100%{box-shadow:inset 0 0 90px rgba(154,32,48,.2)}
    14%{box-shadow:inset 0 0 160px rgba(154,32,48,.5)}
    28%{box-shadow:inset 0 0 100px rgba(154,32,48,.22)}
  }
  #overlay.clear{
    background:
      radial-gradient(90% 70% at 50% 110%, rgba(40,48,46,.45), transparent 55%),
      var(--ink);
  }

  .corner{
    position:absolute;z-index:5;pointer-events:none;
    font-family:Futura,"DIN Alternate",Impact,"Arial Black",sans-serif;
    font-size:10px;letter-spacing:.42em;color:rgba(239,230,216,.38);
  }
  .corner.tl{top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left))}
  .corner.br{
    bottom:calc(16px + env(safe-area-inset-bottom));right:calc(16px + env(safe-area-inset-right));
    color:var(--blood);border:1.5px solid var(--blood);padding:4px 8px;
    letter-spacing:.28em;transform:rotate(-7deg);
  }

  #overlay .panel{
    position:relative;z-index:4;width:min(94vw,680px);
    background:transparent;border:0;box-shadow:none;clip-path:none;
    padding:28px 16px 20px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;
  }
  #overlay .panel::before{display:none}

  .stamp{
    display:inline-block;font-family:Futura,"DIN Alternate",Impact,"Arial Black",sans-serif;
    font-size:clamp(11px,3.2vw,14px);letter-spacing:.42em;
    color:var(--blood);border:2px solid var(--blood);padding:5px 12px;
    transform:rotate(-8deg);margin:0 0 22px;background:rgba(5,6,10,.55);
  }
  .stamp.good{color:var(--ice);border-color:var(--ice);transform:rotate(7deg)}
  .stamp.halt{color:var(--bone);border-color:rgba(239,230,216,.45);transform:rotate(-3deg)}

  .title-mark{
    margin:0;line-height:.9;transform:rotate(-1.4deg);
    text-align:center;
  }
  .title-mark .t1,.title-mark .t2{
    display:block;width:fit-content;margin-left:auto;margin-right:auto;
  }
  .title-mark .t1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Hiragino Mincho",serif;
    font-size:clamp(22px,7vw,40px);font-weight:700;letter-spacing:.55em;
    color:var(--ice);margin:0 auto 10px;padding-left:.55em;
  }
  .title-mark .t2{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Hiragino Mincho",serif;
    font-size:clamp(48px,16vw,104px);font-weight:900;letter-spacing:-.06em;
    color:var(--bone);
    text-shadow:3px 4px 0 #000, -2px 0 0 var(--blood);
  }
  h2.glitch{
    position:relative;display:inline-block;margin:4px 0 8px;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Hiragino Mincho",serif;
    font-size:clamp(40px,13vw,86px);line-height:.95;letter-spacing:-.04em;font-weight:900;
    color:var(--bone);text-shadow:3px 3px 0 #000,-1px 0 0 var(--blood);
    transform:rotate(-1.2deg);
  }
  .glitch{position:relative;animation:flick 6.4s steps(3) infinite}
  .glitch::before,.glitch::after{
    content:attr(data-t);position:absolute;left:0;top:0;width:100%;
    pointer-events:none;mix-blend-mode:screen;
  }
  .glitch::before{color:var(--ice);opacity:.8;clip-path:inset(0 0 54% 0);transform:translate(-2px,-1px);animation:g1 3.6s steps(2) infinite}
  .glitch::after{color:var(--blood);opacity:.85;clip-path:inset(50% 0 0 0);transform:translate(2px,1px);animation:g2 2.8s steps(2) infinite}
  @keyframes g1{0%,86%{transform:translate(-2px,-1px)}89%{transform:translate(-6px,-3px)}93%{transform:translate(3px,1px)}100%{transform:translate(-2px,-1px)}}
  @keyframes g2{0%,84%{transform:translate(2px,1px)}88%{transform:translate(7px,3px)}92%{transform:translate(-3px,-1px)}100%{transform:translate(2px,1px)}}
  @keyframes flick{0%,95%{opacity:1}96%{opacity:.55}97%{opacity:1}98.5%{opacity:.78}}
  .glitch.bad{color:#f3e6e6;text-shadow:3px 3px 0 #000,0 0 18px rgba(154,32,48,.55)}
  .glitch.good{color:var(--bone);text-shadow:3px 3px 0 #000,0 0 16px rgba(154,168,180,.25)}

  .sub-en{
    font-family:Futura,"DIN Alternate",Impact,sans-serif;
    font-size:clamp(10px,2.8vw,13px);
    letter-spacing:.46em;white-space:nowrap;
    color:rgba(239,230,216,.5);margin:14px 0 0;
  }
  .best-num{
    margin-top:22px;font-family:Futura,"DIN Alternate",Impact,sans-serif;
    font-size:12px;letter-spacing:.38em;color:rgba(239,230,216,.4);
    min-height:1.2em;
  }
  .cold-line{
    margin-top:18px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:clamp(12px,3.4vw,15px);letter-spacing:.18em;color:rgba(239,230,216,.55);
  }

  #overlay p{color:rgba(239,230,216,.62)}
  b.oni{color:var(--blood)}
  b.goal{color:var(--bone)}

  .statrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 4px}
  .stat{
    min-width:108px;border:1px solid rgba(239,230,216,.18);
    padding:8px 12px;font-family:Futura,"DIN Alternate",sans-serif;
  }
  .stat .k{display:block;font-size:9px;letter-spacing:.28em;color:rgba(239,230,216,.38);margin-bottom:3px}
  .stat b{font-size:20px;color:var(--bone)}
  .rank{font-size:44px;line-height:1;color:var(--blood);letter-spacing:.04em}

  .cta{
    margin-top:28px;font-family:Futura,"DIN Alternate",Impact,sans-serif;
    font-size:13px;letter-spacing:.52em;color:var(--bone);
    background:none;border:0;padding:14px 20px;min-height:48px;cursor:pointer;
  }
  .cta.bad{color:var(--blood)}
  .cta.good{color:var(--ice)}

  .pbtn{
    pointer-events:auto;display:inline-block;margin:8px 4px 0;padding:10px 18px;
    font-family:Futura,"DIN Alternate",sans-serif;font-size:12px;letter-spacing:.18em;
    border:1px solid rgba(239,230,216,.45);background:transparent;color:var(--bone);cursor:pointer;
  }
  .pbtn:active,.pbtn.press{background:rgba(239,230,216,.12)}
  .pbtn.bad{border-color:var(--blood);color:#e8b4b8}

  @media (max-height:620px){
    .title-mark .t2{font-size:clamp(40px,12vw,72px)}
    h2.glitch{font-size:clamp(32px,11vw,64px)}
    #overlay .panel{padding:16px 12px 12px}
    .cta{margin-top:16px}
  }
  /* ステージ切替：ぼやけて浮かび、消える。操作は奪わない */
  #stageMark{
    position:absolute;left:50%;top:36%;z-index:8;
    transform:translate(-50%,18px);
    text-align:center;pointer-events:none;display:none;
    color:#efe6d8;opacity:0;
  }
  #stageMark.show{display:block;animation:stageRise 2.6s ease-out forwards;will-change:opacity,transform,filter}
  #stageMark .k{
    display:block;
    font-family:Futura,"DIN Alternate",Impact,"Arial Black",sans-serif;
    font-size:clamp(11px,3.2vw,14px);letter-spacing:.46em;padding-left:.46em;
    color:#9a2030;margin-bottom:6px;
  }
  #stageMark .n{
    display:block;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Hiragino Mincho",serif;
    font-size:clamp(56px,18vw,108px);font-weight:900;line-height:.9;letter-spacing:.12em;
    text-shadow:3px 4px 0 #000,-2px 0 0 #9a2030;
    white-space:nowrap;
  }
  @keyframes stageRise{
    0%  {opacity:0;filter:blur(16px);-webkit-filter:blur(16px);transform:translate(-50%,22px)}
    22% {opacity:1;filter:blur(2px);-webkit-filter:blur(2px);transform:translate(-50%,4px)}
    38% {opacity:1;filter:blur(0);-webkit-filter:blur(0);transform:translate(-50%,-4px)}
    68% {opacity:.9;filter:blur(0);-webkit-filter:blur(0);transform:translate(-50%,-14px)}
    100%{opacity:0;filter:blur(12px);-webkit-filter:blur(12px);transform:translate(-50%,-38px)}
  }
  @media (prefers-reduced-motion:reduce){
    #overlay::after,.glitch,.glitch::before,.glitch::after,.blink{animation:none!important}
    #stageMark.show{animation:stageRiseFlat 1.6s linear forwards}
    @keyframes stageRiseFlat{0%{opacity:0;filter:none}18%{opacity:1}70%{opacity:1}100%{opacity:0}}
  }
</style>
<meta property="og:title" content="帰宅鬼ごっこ 〜交番までダッシュ〜">
<meta property="og:description" content="終電後の住宅街。鬼から逃げて交番へ駆け込め。スマホのブラウザでそのまま遊べます。">

<body>
<div id="wrap">
  <!-- 幕を canvas より前に置く（harness のタップ対象＝見える開始ボタン）。見た目は z-index で制御 -->
  <div id="overlay" class="title">
    <div class="corner tl">00:14</div>
    <div class="corner br">NO EXIT</div>
    <div class="panel" id="panel">
      <div class="stamp">LAST TRAIN</div>
      <h1 class="title-mark">
        <span class="t1">帰宅</span>
        <span class="t2 glitch" data-t="鬼ごっこ">鬼ごっこ</span>
      </h1>
      <div class="sub-en">DEAD STREET</div>
      <div class="best-num" id="bestLine"></div>
      <button type="button" class="cta blink" id="startTap">TAP</button>
    </div>
  </div>

  <canvas id="game"></canvas>

  <div id="hud">
    <div id="topLeft" class="box">TIME <span id="time">0:00</span><div class="small" id="stageLab">1 / 5</div></div>
    <div id="topCenter" class="box"><span id="state" class="safe">● 安全</span><div class="small" id="sub">交番をさがせ</div></div>

    <div id="botLeft" class="box">
      <div>スタミナ</div>
      <div class="barwrap"><div class="bar" id="staBar"></div></div>
      <div style="margin-top:6px">気配</div>
      <div class="barwrap"><div class="bar" id="presenceBar" style="width:0%"></div></div>
      <div id="breathRow">
        <div>息（かくれ中）</div>
        <div class="barwrap"><div class="bar" id="breathBar"></div></div>
      </div>
    </div>

    <div id="botRight" class="box">
      <canvas id="map" width="66" height="66"></canvas>
      <div class="small" id="mapCap">MAP</div>
    </div>

    <div id="hint" class="box"><span id="hintText"></span></div>
    <div id="stageMark" aria-live="polite">
      <span class="k">STAGE</span>
      <span class="n" id="stageMarkN">2</span>
    </div>
  </div>

  <div id="sysbar">
    <div class="sysbtn" id="btnMute" role="button" tabindex="0" aria-label="音のオン・オフ">♪</div>
    <div class="sysbtn" id="btnPause" role="button" tabindex="0" aria-label="ポーズ">Ⅱ</div>
  </div>

  <div id="touch">
    <div id="stick" role="button" aria-label="移動スティック"><div id="knob"></div></div>
    <div class="lookbtn" id="tLookL" role="button" aria-label="視点を左へ">◀</div>
    <div class="lookbtn" id="tLookR" role="button" aria-label="視点を右へ">▶</div>
    <div class="tbtn" id="tDash" role="button" aria-label="ダッシュ">ダッシュ</div>
    <div class="tbtn" id="tHide" role="button" aria-label="かくれる">かくれる</div>
  </div>

</div>

<!-- preload=none: 起動時に本体を取りに行くと harness の networkidle が落ちる。最初のタップで読む。
     m4a は AAC-LC 96k（HE-AACは native ffmpeg で壊れる）。mp3 は非対応ブラウザ用。 -->
<audio id="bgm" loop preload="none" playsinline webkit-playsinline>
  <source src="audio/Behind_The_Locked_Gate.m4a" type="audio/mp4">
  <source src="audio/Behind_The_Locked_Gate.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
if(typeof THREE==="undefined"){

/* ============================================================
   定数 / ユーティリティ
============================================================ */

const NAV=2.0, NW=Math.ceil(WORLD/NAV);          // ナビグリッド
const ONI_SCALE=2;          /* 見た目だけ2倍。速度・視界は据え置き */
const ONI_RADIUS=0.72;      /* 通路10m。2倍にすると詰まるので当たりは控えめ */
const ONI_CATCH=2.0;        /* 旧1.5。モデルに食い込む手前＋短いリーチ */
const ONI_CATCH_HIDE=1.35;  /* 旧1.0。隠れ中はより接近しないと捕まる */

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const UP=new THREE.Vector3(0,1,0);

/* ============================================================
   テクスチャ生成（ドット絵風）
============================================================ */
function tex(draw,size){
  const c=document.createElement("canvas"); c.width=c.height=size||32;
  draw(c.getContext("2d"),c.width);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
const WALL_COLORS=["#39405e","#454b6b","#2f3752","#4d4356","#3b4a52","#524a41"];
const LIT=["#ffe9a8","#ffd47a","#cfe4ff","#ffeec9"];
function buildingTex(base,lit){
  return tex((g,s)=>{
    g.fillStyle=base; g.fillRect(0,0,s,s);
    g.fillStyle="rgba(0,0,0,.18)"; g.fillRect(0,0,s,2);
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){
      const on=Math.random()<0.42;
      g.fillStyle=on?lit:"#141a2e";
      g.fillRect(3+x*7,4+y*7,5,5);
      if(on){g.fillStyle="rgba(255,255,255,.25)";g.fillRect(3+x*7,4+y*7,5,1);}
    }
  },32);
}
const asphaltTex=tex((g,s)=>{
  g.fillStyle="#1b1f2e"; g.fillRect(0,0,s,s);
  for(let i=0;i<90;i++){
    g.fillStyle=Math.random()<0.5?"#20263a":"#171b29";
    g.fillRect(ri(0,s-1),ri(0,s-1),1,1);
  }
},32);
asphaltTex.repeat.set(WORLD/4,WORLD/4);

const walkTex=tex((g,s)=>{
  g.fillStyle="#3a405a"; g.fillRect(0,0,s,s);
  g.strokeStyle="#2d3248"; g.lineWidth=1;
  for(let i=0;i<=s;i+=8){g.beginPath();g.moveTo(i,0);g.lineTo(i,s);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(s,i);g.stroke();}
},32);

  hideSpots.push({x:x-Math.sin(rot||0)*1.3,z:z-Math.cos(rot||0)*1.3,r:1.6});
}

function car(x,z,rot){
  const g=new THREE.Group();

/* 建物 */
function building(cx,cz,w,d,h){
  const base=pick(WALL_COLORS), lit=pick(LIT);
  const t=buildingTex(base,lit);
  t.repeat.set(Math.max(1,Math.round(w/4)),Math.max(1,Math.round(h/4)));
  const mats=[];
  for(let i=0;i<6;i++){
    if(i===2||i===3) mats.push(new THREE.MeshLambertMaterial({color:0x232a44}));
    else mats.push(new THREE.MeshLambertMaterial({map:t}));
  }
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats);
  m.position.set(cx,h/2,cz); worldGroup.add(m);
  addSolid(cx-w/2,cx+w/2,cz-d/2,cz+d/2);
}

/* 街区 */
const blockKind=[];
for(let bz=0;bz<N;bz++){
  blockKind[bz]=[];
  for(let bx=0;bx<N;bx++){
    const x0=blockOrigin(bx), z0=blockOrigin(bz);
    const cx=x0+BLOCK/2, cz=z0+BLOCK/2;

    /* 歩道 */
    const wk=new THREE.Mesh(new THREE.BoxGeometry(BLOCK+3,0.22,BLOCK+3),
          new THREE.MeshLambertMaterial({map:walkTex.clone()}));
    wk.material.map.repeat.set((BLOCK+3)/4,(BLOCK+3)/4);
    wk.material.map.needsUpdate=true;
    wk.position.set(cx,0.11,cz); worldGroup.add(wk);

    let kind="city";
    const r=Math.random();
    if(r<0.16) kind="park"; else if(r<0.30) kind="lot";
    blockKind[bz][bx]=kind;

    if(kind==="city"){
      for(let ly=0;ly<2;ly++)for(let lx=0;lx<2;lx++){
        if(Math.random()<0.18){                       // 空き地＝路地の物陰
          const ax=x0+2+lx*16+7, az=z0+2+ly*16+7;
          bush(ax+rnd(-3,3),az+rnd(-3,3));
          if(Math.random()<0.5) bush(ax+rnd(-4,4),az+rnd(-4,4));
          hideSpots.push({x:ax,z:az,r:2.4});
          continue;
        }
        const w=rnd(10,13.5), d=rnd(10,13.5);
        const bxx=x0+2+lx*16+7+rnd(-0.7,0.7), bzz=z0+2+ly*16+7+rnd(-0.7,0.7);
        building(bxx,bzz,w,d,rnd(6,17));
      }
      hideSpots.push({x:x0+BLOCK/2,z:z0+BLOCK/2,r:2.2});  // 中央路地
    } else if(kind==="park"){
      const gr=new THREE.Mesh(new THREE.BoxGeometry(BLOCK-2,0.1,BLOCK-2),
            new THREE.MeshLambertMaterial({color:0x25412f}));
      gr.position.set(cx,0.27,cz); worldGroup.add(gr);
      for(let i=0;i<7;i++){
        const tx=cx+rnd(-11,11), tz=cz+rnd(-11,11);
        const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.32,3.2,6),
              new THREE.MeshLambertMaterial({color:0x4a3726}));
        tr.position.set(tx,1.6,tz); worldGroup.add(tr);
        const lv=new THREE.Mesh(new THREE.BoxGeometry(3.2,2.6,3.2),
              new THREE.MeshLambertMaterial({color:0x2e6340}));
        lv.position.set(tx,4.0,tz); worldGroup.add(lv);
        addSolid(tx-0.4,tx+0.4,tz-0.4,tz+0.4);
        hideSpots.push({x:tx,z:tz,r:1.7});
      }
      for(let i=0;i<3;i++) bush(cx+rnd(-12,12),cz+rnd(-12,12));
    } else {
      const pv=new THREE.Mesh(new THREE.BoxGeometry(BLOCK-2,0.1,BLOCK-2),
            new THREE.MeshLambertMaterial({color:0x252a3c}));
      pv.position.set(cx,0.27,cz); worldGroup.add(pv);
      const n=ri(3,5);
      for(let i=0;i<n;i++) car(cx-10+i*5,cz+rnd(-8,8),0);
    }

    /* 街灯・電柱・自販機 */
    streetLamp(x0-ROAD/2, z0-ROAD/2);
    if(Math.random()<0.55) pole(x0+BLOCK+2.2, z0+rnd(4,BLOCK-4));
    if(Math.random()<0.5)  vending(x0+rnd(4,BLOCK-4), z0-2.2, Math.PI);
    if(Math.random()<0.35) vending(x0-2.2, z0+rnd(4,BLOCK-4), -Math.PI/2);
  }
}

const blocked=new Uint8Array(NW*NW);
function cellIdx(ix,iz){ return iz*NW+ix; }
function toCell(v){ return clamp(Math.floor((v+HALF)/NAV),0,NW-1); }
function cellCenter(i){ return -HALF+(i+0.5)*NAV; }
function rasterize(){
  blocked.fill(0);
  for(const s of solids){
    const x0=toCell(s.minX-0.9), x1=toCell(s.maxX+0.9);
    const z0=toCell(s.minZ-0.9), z1=toCell(s.maxZ+0.9);
    for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++) blocked[cellIdx(x,z)]=1;
  }
}

/* 交番：ゴール。到達でステージが進み、5でクリア。位置はステージごとに移す */
const KOBAN={x:0,z:0};
let kobanSolid=null;
function pickKobanPos(fromX,fromZ,minDist){
  let best=null, bestD=0;
  for(let i=0;i<140;i++){
    const bx=ri(0,N-1), bz=ri(0,N-1);
    const x0=blockOrigin(bx), z0=blockOrigin(bz);
    const p={
      x:clamp(x0+BLOCK/2+rnd(-8,8),-HALF+8,HALF-8),
      z:z0-ROAD/2
    };
    const d=Math.hypot(p.x-fromX,p.z-fromZ);
    if(d>=minDist && d>bestD){ best=p; bestD=d; }
  }
  return best || {x:clamp(-HALF+20, -HALF+8, HALF-8), z:-HALF+ROAD};
}
function placeKoban(x,z){
  KOBAN.x=x; KOBAN.z=z;
  const g=window.__kobanGroup;
  if(g) g.position.set(x,0,z);
  if(!kobanSolid){
    kobanSolid={minX:x-3.5,maxX:x+3.5,minZ:z-3,maxZ:z+3};
    solids.push(kobanSolid);
  }else{
    kobanSolid.minX=x-3.5; kobanSolid.maxX=x+3.5; kobanSolid.minZ=z-3; kobanSolid.maxZ=z+3;
  }
  rasterize();
}

/* ============================================================
   ナビゲーション用グリッド
============================================================ */
const queue=new Int32Array(NW*NW);
function bfsFrom(tx,tz,dist){
  dist.fill(-1);
  let sx=toCell(tx), sz=toCell(tz);
  if(blocked[cellIdx(sx,sz)]){                       // 近傍の通行可能セルへ寄せる
    let best=-1,bd=1e9;
    for(let z=Math.max(0,sz-4);z<=Math.min(NW-1,sz+4);z++)
      for(let x=Math.max(0,sx-4);x<=Math.min(NW-1,sx+4);x++)
        if(!blocked[cellIdx(x,z)]){const d=(x-sx)*(x-sx)+(z-sz)*(z-sz); if(d<bd){bd=d;best=cellIdx(x,z);}}
    if(best<0) return;
    sx=best%NW; sz=(best/NW)|0;
  }
  let head=0,tail=0;
  const s=cellIdx(sx,sz); dist[s]=0; queue[tail++]=s;
  while(head<tail){
    const c=queue[head++], cx=c%NW, cz=(c/NW)|0, d=dist[c]+1;
    for(let k=0;k<4;k++){
      const nx=cx+(k===0?1:k===1?-1:0), nz=cz+(k===2?1:k===3?-1:0);
      if(nx<0||nz<0||nx>=NW||nz>=NW) continue;
      const ni=cellIdx(nx,nz);
      if(blocked[ni]||dist[ni]>=0) continue;
      dist[ni]=d; queue[tail++]=ni;
    }
  }
}
function losBlocked(ax,az,bx,bz){
  const dx=bx-ax, dz=bz-az, len=Math.hypot(dx,dz);
  const steps=Math.ceil(len/1.0);
  for(let i=1;i<steps;i++){
    const t=i/steps, x=ax+dx*t, z=az+dz*t;
    if(blocked[cellIdx(toCell(x),toCell(z))]) return true;
  }
  return false;
}
function randomRoadPoint(){
  for(let i=0;i<400;i++){
    const x=rnd(-HALF+4,HALF-4), z=rnd(-HALF+4,HALF-4);
    if(!blocked[cellIdx(toCell(x),toCell(z))]) return {x,z};
  }
  return {x:0,z:0};
}

/* ============================================================
   サウンド（簡易シンセ ＋ BGM）
   BGMは decodeAudioData に載せない（iPhoneで展開が重い）。
   <audio> のまま流し、音量だけ WebAudio の gain を通す
   （iOS Safari は media要素の .volume 代入を無視する）
============================================================ */
let actx=null, muted=false, audioUnlocked=false;
try{ muted = localStorage.getItem("tg.234.mute")==="1"; }catch(e){}
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }

const BGM_VOL=0.34;
const BGM_NEAR_MUL=1.1;
const BGM_NEAR_IN=20;   /* 気配と同じ：近づいたら上げる */
const BGM_NEAR_OUT=22;  /* 少し広くして境界で点滅しない */
let bgmEl=null, bgmSrc=null, bgmGain=null, bgmOffT=0;
let bgmNear=false;
function bgmPlayVol(){ return BGM_VOL*(bgmNear?BGM_NEAR_MUL:1); }
function syncBgmNear(nearest){
  let next=bgmNear;
  if(state!==ST.PLAY) next=false;
  else if(bgmNear) next=nearest<BGM_NEAR_OUT;
  else next=nearest<BGM_NEAR_IN;
  if(next===bgmNear) return;
  bgmNear=next;
  if(muted||!bgmEl||bgmEl.paused) return;
  bgmFade(bgmPlayVol(),0.28);
}
function bgmInit(){
  if(!bgmEl){ bgmEl=document.getElementById("bgm"); if(!bgmEl) return false; bgmEl.loop=true; }
  if(!bgmGain){
    const a=audio();
    if(a && a.createMediaElementSource){
      try{
        bgmSrc=a.createMediaElementSource(bgmEl);
        bgmGain=a.createGain(); bgmGain.gain.value=0;
        bgmSrc.connect(bgmGain); bgmGain.connect(a.destination);
      }catch(e){ bgmSrc=null; bgmGain=null; }
    }
  }
  return true;
}
function bgmFade(to,sec){
  if(!bgmGain){ if(bgmEl){ try{ bgmEl.volume=to; }catch(e){} } return; }
  const a=audio(); if(!a) return;
  const t=a.currentTime, g=bgmGain.gain;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(to,t+sec);
}
function bgmStart(){
  if(muted||!bgmInit()) return;
  clearTimeout(bgmOffT);
  const pr=bgmEl.play();
  if(pr&&pr.catch) pr.catch(function(){});
  bgmFade(bgmPlayVol(),1.2);
}
function bgmStop(){
  if(!bgmEl) return;
  bgmFade(0,0.32);
  clearTimeout(bgmOffT);
  bgmOffT=setTimeout(function(){
    if(bgmEl && (muted || document.hidden || (state!==ST.PLAY && state!==ST.TITLE))) bgmEl.pause();
  },360);
}

/* iOS: ユーザー操作のたびに suspended を解除し、BGMを同じジェスチャ内で play する */
function unlockAudio(){
  const a=audio(); if(a && a.state==="suspended"){ try{ a.resume(); }catch(e){} }
  audioUnlocked=true;
  if(!muted) bgmStart();
}
function setMute(v){
  muted=!!v;
  try{ localStorage.setItem("tg.234.mute", muted?"1":"0"); }catch(e){}
  const b=document.getElementById("btnMute");
  if(b){ b.textContent = muted?"✕":"♪"; b.classList.toggle("off",muted);
         b.setAttribute("aria-label", muted?"音を出す":"音を消す"); }
  if(muted) bgmStop();
  else if(audioUnlocked) bgmStart();
}
function beep(freq,dur,type,vol,slide){
  if(muted) return;
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(freq,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.08,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function noise(dur,vol){
  if(muted) return;
  const a=audio(); if(!a) return;
  const n=a.sampleRate*dur, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=vol||0.05;
  s.connect(g); g.connect(a.destination); s.start();
}

const touchUI=document.getElementById("touch"), stick=document.getElementById("stick"), knob=document.getElementById("knob");

function stickTo(e){
  const r=stick.getBoundingClientRect();
  let dx=(e.clientX-r.left-r.width/2)/(r.width/2);
  let dy=(e.clientY-r.top-r.height/2)/(r.height/2);
  const l=Math.hypot(dx,dy); if(l>1){ dx/=l; dy/=l; }
  tMove={x:dx,y:dy};
  knob.style.left=(50+dx*32)+"%"; knob.style.top=(50+dy*32)+"%";
}
function stickRelease(){
  stickId=null; tMove={x:0,y:0};
  knob.style.left="50%"; knob.style.top="50%";
}
stick.addEventListener("pointerdown",e=>{
  e.preventDefault(); stickId=e.pointerId;
  try{ stick.setPointerCapture(e.pointerId); }catch(err){}
  unlockAudio(); stickTo(e);
});
stick.addEventListener("pointermove",e=>{ if(stickId===e.pointerId) stickTo(e); });
stick.addEventListener("pointerup",e=>{ if(stickId===e.pointerId) stickRelease(); });
stick.addEventListener("pointercancel",e=>{ if(stickId===e.pointerId) stickRelease(); });
stick.addEventListener("lostpointercapture",e=>{ if(stickId===e.pointerId) stickRelease(); });

/* ============================================================
   物理 / 当たり判定
============================================================ */
function hits(x,z,r){
  for(let i=0;i<solids.length;i++){
    const s=solids[i];
    if(x+r>s.minX && x-r<s.maxX && z+r>s.minZ && z-r<s.maxZ) return true;
  }
  return false;
}
function moveWithCollision(obj,dx,dz,r){
  if(!hits(obj.x+dx,obj.z,r)) obj.x+=dx;
  if(!hits(obj.x,obj.z+dz,r)) obj.z+=dz;
  obj.x=clamp(obj.x,-HALF+1.5,HALF-1.5);
  obj.z=clamp(obj.z,-HALF+1.5,HALF-1.5);
}
function nearHideSpot(){
  let best=null,bd=1e9;
  for(const h of hideSpots){
    const d=Math.hypot(h.x-player.x,h.z-player.z);
    if(d<h.r+0.6 && d<bd){bd=d;best=h;}
  }
  return best;
}
function toggleHide(){
  if(state!==ST.PLAY) return;
  if(player.hidden){ player.hidden=false; player.hideRef=null; beep(300,0.08,"square",0.05); return; }
  const h=nearHideSpot();
  if(h && player.breath>0.12){ player.hidden=true; player.hideRef=h; beep(420,0.1,"triangle",0.05); }
  else flash("ここには隠れられない");
}

/* ============================================================
   明るさ（街灯の下は見つかりやすい）
============================================================ */
function brightness(x,z){
  let b=0.25;
  for(const l of lampPools){
    const d=Math.hypot(l.x-x,l.z-z);
    if(d<l.r) b=Math.max(b,1-d/l.r);
  }
  return b;
}

/* ============================================================
   鬼AI
============================================================ */
function updateOni(o,dt){
  const dx=player.x-o.x, dz=player.z-o.z;
  const d=Math.hypot(dx,dz);
  const los=!losBlocked(o.x,o.z,player.x,player.z);

  /* 視界判定 */
  const facing=Math.atan2(dx,dz);
  let da=Math.abs(((facing-o.yaw+Math.PI*3)%(Math.PI*2))-Math.PI);
  const bright=brightness(player.x,player.z);
  let sight=(o.state==="chase"?34:22)*(0.55+bright*0.75);
  if(player.hidden) sight*=0.18;
  const inCone=da<(o.state==="chase"?1.5:0.95);
  const seen=los && d<sight && inCone;

  /* 音（ダッシュ・近距離の足音） */
  const heard = los && d < player.noise;

  if(seen||heard){
    if(o.state!=="chase"){ o.growl=0; noise(0.25,0.06); beep(150,0.35,"sawtooth",0.08,90); }
    o.state="chase"; o.lastKnown={x:player.x,z:player.z}; o.searchTime=0; o.alert=1;
  } else if(o.state==="chase"){
    o.searchTime+=dt;
    if(o.searchTime>2.4){ o.state="search"; o.searchTime=0; o.target=o.lastKnown||randomRoadPoint(); }
  } else if(o.state==="search"){
    o.searchTime+=dt;
    const td=Math.hypot(o.target.x-o.x,o.target.z-o.z);
    if(td<2.5||o.searchTime>9){ o.state="patrol"; o.target=randomRoadPoint(); o.searchTime=0; o.alert=0; }
  }

  /* 目標地点 */
  let tx,tz;
  if(o.state==="chase"){ tx=player.x; tz=player.z; }
  else { tx=o.target.x; tz=o.target.z; }
  if(o.state==="patrol" && Math.hypot(tx-o.x,tz-o.z)<3){ o.target=randomRoadPoint(); tx=o.target.x; tz=o.target.z; }

  /* 経路（BFS の距離場を下る） */
  o.pathTime-=dt;
  if(o.pathTime<=0){ bfsFrom(tx,tz,o.dist); o.pathTime=(o.state==="chase"?0.35:0.9); }
  const dist=o.dist;
  let mvx=0,mvz=0;
  const cx=toCell(o.x), cz=toCell(o.z), here=dist[cellIdx(cx,cz)];
  let best=-1,bv=here<0?1e9:here;
  for(let k=0;k<8;k++){
    const nx=cx+[1,-1,0,0,1,1,-1,-1][k], nz=cz+[0,0,1,-1,1,-1,1,-1][k];
    if(nx<0||nz<0||nx>=NW||nz>=NW) continue;
    const v=dist[cellIdx(nx,nz)];
    if(v>=0 && v<bv){ bv=v; best=k; }
  }
  if(best>=0){
    const nx=cx+[1,-1,0,0,1,1,-1,-1][best], nz=cz+[0,0,1,-1,1,-1,1,-1][best];
    mvx=cellCenter(nx)-o.x; mvz=cellCenter(nz)-o.z;
  } else { mvx=tx-o.x; mvz=tz-o.z; }
  const ml=Math.hypot(mvx,mvz)||1;
  mvx/=ml; mvz/=ml;

  const spd=(o.state==="chase"? o.speed*1.32 : o.state==="search"? o.speed*0.95 : o.speed*0.72);
  moveWithCollision(o,mvx*spd*dt,mvz*spd*dt,ONI_RADIUS);

  const want=Math.atan2(mvx,mvz);
  let diff=((want-o.yaw+Math.PI*3)%(Math.PI*2))-Math.PI;
  o.yaw+=diff*Math.min(1,dt*6);

  o.mesh.position.set(o.x,0,o.z);
  o.mesh.rotation.y=o.yaw;
  o.shadow.position.set(o.x,0.3,o.z);
  const ph=performance.now()/1000*(o.state==="chase"?8:4.5);
  o.mesh.userData.l1.rotation.x=Math.sin(ph)*0.7;
  o.mesh.userData.l2.rotation.x=-Math.sin(ph)*0.7;

  /* 捕獲：見た目2倍に合わせて少し広げ、隠れ中はより接近しないと捕まる */
  if(d<ONI_CATCH && state===ST.PLAY && !(player.hidden && d>ONI_CATCH_HIDE)){ gameOver(); }

  /* うなり声 */
  o.growl-=dt;
  if(o.state==="chase" && o.growl<=0){ o.growl=1.2; beep(rnd(90,130),0.3,"sawtooth",0.05); }
  return d;
}

/* ============================================================
   HUD
============================================================ */
const el={
  time:document.getElementById("time"), stageLab:document.getElementById("stageLab"),
  state:document.getElementById("state"),
  sub:document.getElementById("sub"), sta:document.getElementById("staBar"),
  pres:document.getElementById("presenceBar"), breathRow:document.getElementById("breathRow"),
  breath:document.getElementById("breathBar"), hint:document.getElementById("hint"),
  hintText:document.getElementById("hintText"), overlay:document.getElementById("overlay"),
  panel:document.getElementById("panel"), map:document.getElementById("map"),
  mapCap:document.getElementById("mapCap")
};
const mctx=el.map.getContext("2d");
let flashT=0;
function flash(msg){ el.hintText.textContent=msg; el.hint.style.display="block"; flashT=1.6; }
let stageMarkT=0;
function hideStageBanner(){
  const box=document.getElementById("stageMark");
  if(!box) return;
  box.classList.remove("show");
  box.style.display="none";
  clearTimeout(stageMarkT);
}
function showStageBanner(n){
  const box=document.getElementById("stageMark");
  const num=document.getElementById("stageMarkN");
  if(!box||!num) return;
  num.textContent=String(n);
  box.classList.remove("show");
  box.style.display="block";
  void box.offsetWidth;
  box.classList.add("show");
  clearTimeout(stageMarkT);
  stageMarkT=setTimeout(hideStageBanner,2700);
}

function drawMap(){
  const S=el.map.width, sc=S/WORLD;
  mctx.fillStyle="#0b1020"; mctx.fillRect(0,0,S,S);
  mctx.fillStyle="#232b46";
  for(let bz=0;bz<N;bz++)for(let bx=0;bx<N;bx++){
    const x0=blockOrigin(bx), z0=blockOrigin(bz);
    mctx.fillRect((x0+HALF)*sc,(z0+HALF)*sc,BLOCK*sc,BLOCK*sc);
  }
  /* 駅 */
  mctx.fillStyle="#5b8cff";
  mctx.fillRect((START.x+HALF)*sc-2,(START.z+HALF)*sc-2,4,4);
  /* 交番（発見後のみ） */
  if(kobanFound){
    mctx.fillStyle=(performance.now()%600<300)?"#ffe066":"#ff8a3d";
    mctx.fillRect((KOBAN.x+HALF)*sc-3,(KOBAN.z+HALF)*sc-3,6,6);
  }
  /* 鬼（30m以内 or 追跡中のみ） */
  for(const o of onis){
    const d=Math.hypot(o.x-player.x,o.z-player.z);
    if(d<30||o.state==="chase"){
      mctx.fillStyle="#"+("000000"+o.color.toString(16)).slice(-6);
      mctx.fillRect((o.x+HALF)*sc-3,(o.z+HALF)*sc-3,6,6);
    }
  }
  /* プレイヤー */
  mctx.fillStyle=player.hidden?"#6ee7a0":"#ffffff";
  mctx.fillRect((player.x+HALF)*sc-2,(player.z+HALF)*sc-2,4,4);
}

/* ============================================================
   ゲーム進行
============================================================ */
function start(){
  audio(); unlockAudio();
  if(state!==ST.PLAY){
    resetGame(); state=ST.PLAY;
    el.overlay.classList.remove("dead","title","clear");
    el.overlay.style.display="none";
    beep(660,0.12,"square",0.07);
  }
}
function pauseGame(){
  if(state!==ST.PLAY) return;
  state=ST.PAUSE;
  bgmStop();
  if(document.exitPointerLock) document.exitPointerLock();
  tMove={x:0,y:0}; tDash=false; lookDir=0;
  el.panel.innerHTML=
    '<div class="stamp halt">HALT</div>'+
    '<h2 class="glitch" data-t="PAUSE">PAUSE</h2>'+
    '<div class="statrow"><div class="stat"><span class="k">TIME</span><b>'+fmt(elapsed)+'</b></div></div>'+
    '<p style="margin-top:10px"><span class="pbtn" id="pbResume">RESUME</span>'+
    '<span class="pbtn bad" id="pbRestart">RESET</span></p>';
  const r=document.getElementById("pbResume"), rs=document.getElementById("pbRestart");
  if(r)  r.addEventListener("click",ev=>{ ev.stopPropagation(); resumeGame(); });
  if(rs) rs.addEventListener("click",ev=>{ ev.stopPropagation(); start(); });
  el.overlay.style.display="flex";
}
function resumeGame(){
  if(state!==ST.PAUSE) return;
  state=ST.PLAY; el.overlay.style.display="none"; last=performance.now();
  unlockAudio();
}
function gameOver(){
  if(state!==ST.PLAY) return;
  state=ST.OVER; bgmStop(); caughtSfx();
  el.overlay.classList.add("dead");
  el.overlay.classList.remove("title","clear");
  if(document.exitPointerLock) document.exitPointerLock();
  tMove={x:0,y:0}; tDash=false; lookDir=0;
  el.panel.innerHTML=
    '<div class="stamp">CAUGHT</div>'+
    '<h2 class="glitch bad" data-t="つかまった">つかまった</h2>'+
    '<div class="sub-en">NO WITNESS</div>'+
    '<div class="statrow">'+
      '<div class="stat"><span class="k">SURVIVED</span><b>'+fmt(elapsed)+'</b></div>'+
      '<div class="stat"><span class="k">KOBAN</span><b>'+(kobanFound?"FOUND":"LOST")+'</b></div>'+
    '</div>'+
    '<p class="cta bad blink">TAP</p>';
  el.overlay.style.display="flex";
}
function clearGame(){
  if(state!==ST.PLAY) return;
  state=ST.CLEAR; bgmStop(); jingle();
  if(document.exitPointerLock) document.exitPointerLock();
  tMove={x:0,y:0}; tDash=false; lookDir=0;
  const t=elapsed, isBest=saveBest(t), b=bestTime();
  let rank="C";
  if(t<180) rank="S";
  else if(t<280) rank="A";
  else if(t<400) rank="B";
  el.overlay.classList.add("clear");
  el.overlay.classList.remove("title","dead");
  el.panel.innerHTML=
    '<div class="stamp good">SAFE?</div>'+
    '<h2 class="glitch good" data-t="逃げ切った">逃げ切った</h2>'+
    '<div class="sub-en">TONIGHT ONLY</div>'+
    '<div class="statrow">'+
      '<div class="stat"><span class="k">STAGE</span><b>5 / 5</b></div>'+
      '<div class="stat"><span class="k">TIME</span><b>'+fmt(t)+'</b></div>'+
      '<div class="stat"><span class="k">RANK</span><b class="rank">'+rank+'</b></div>'+
      '<div class="stat"><span class="k">BEST</span><b>'+fmt(b===null?t:b)+(isBest?" *":"")+'</b></div>'+
    '</div>'+
    '<p class="cold-line">あしたも同じ道を通る</p>'+
    '<p class="cta blink">TAP</p>';
  el.overlay.style.display="flex";
}
function fmt(t){ const m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+(s<10?"0":"")+s; }

/* ============================================================
   メインループ
============================================================ */
(function initTitle(){
  setMute(muted);
  const b=bestTime(), line=document.getElementById("bestLine");
  if(line){
    line.textContent = (b!==null) ? ("BEST  "+fmt(b)) : "";
  }
})();

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05);

  if(state===ST.PLAY) update(dt);
  render(dt);
}
function update(dt){
  elapsed+=dt;
  if(stageLock>0) stageLock-=dt;

  /* 入力ベクトル */
  let ix=0,iz=0;
  if(keys.KeyW||keys.ArrowUp) iz+=1;
  if(keys.KeyS||keys.ArrowDown) iz-=1;
  if(keys.KeyA) ix-=1;
  if(keys.KeyD) ix+=1;
  if(keys.ArrowLeft) camYaw+=dt*2.0;
  if(keys.ArrowRight) camYaw-=dt*2.0;
  if(keys.KeyQ) camYaw+=dt*2.0;
  if(keys.KeyE) camYaw-=dt*2.0;
  if(lookDir) camYaw-=lookDir*dt*2.2;
  if(tMove.x||tMove.y){ ix+=tMove.x; iz-=tMove.y; }

  const len=Math.hypot(ix,iz);
  if(len>1){ ix/=len; iz/=len; }
  const moving=len>0.08;

  /* かくれ状態 */
  if(player.hidden){
    const h=player.hideRef;
    if(!h || Math.hypot(h.x-player.x,h.z-player.z)>h.r+1.2) player.hidden=false;
    player.breath-=dt/7.5;
    if(player.breath<=0){ player.breath=0; player.hidden=false; flash("息がもたない！"); }
    if(moving && len>0.6){ player.hidden=false; }
  } else {
    player.breath=Math.min(1,player.breath+dt/6);
  }

  /* 移動 */
  const dashKey=(keys.ShiftLeft||keys.ShiftRight||tDash);
  const canDash=dashKey&&player.sta>0.02&&moving&&!player.hidden;
  const speed=player.hidden?1.1:(canDash?6.4:3.5);
  if(canDash){ player.sta=Math.max(0,player.sta-dt/3.2); }
  else { player.sta=Math.min(1,player.sta+dt/(moving?7:4.2)); }

  const fwd=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));
  const right=new THREE.Vector3().crossVectors(fwd,UP).normalize();
  const mv=new THREE.Vector3().addScaledVector(fwd,iz).addScaledVector(right,ix);
  if(mv.lengthSq()>0) mv.normalize();

  if(moving){
    moveWithCollision(player,mv.x*speed*dt,mv.z*speed*dt,0.42);
    player.yaw=Math.atan2(mv.x,mv.z);
    player.walkPhase+=dt*(canDash?15:9);
  } else player.walkPhase*=0.9;

  /* 足音（＝鬼に聞こえる距離） */
  player.noise = player.hidden?0 : (canDash? 26 : moving? 11 : 4);
  if(moving && !player.hidden){
    const st=Math.floor(player.walkPhase/Math.PI);
    if(st!==player._lastStep){ player._lastStep=st; if(canDash) beep(rnd(180,230),0.05,"triangle",0.03); }
  }

  /* プレイヤー描画更新 */
  playerMesh.position.set(player.x, player.hidden?-0.45:0, player.z);
  playerMesh.rotation.y=player.yaw;
  const ph=player.walkPhase;
  playerMesh.userData.l1.rotation.x=Math.sin(ph)*0.8;
  playerMesh.userData.l2.rotation.x=-Math.sin(ph)*0.8;
  playerMesh.userData.a1.rotation.x=-Math.sin(ph)*0.6;
  playerMesh.userData.a2.rotation.x=Math.sin(ph)*0.6;
  playerShadow.position.set(player.x,0.3,player.z);
  playerShadow.material.opacity=player.hidden?0.12:0.35;

  /* 鬼 */
  let nearest=1e9, chasing=false;
  for(const o of onis){
    const d=updateOni(o,dt);
    nearest=Math.min(nearest,d);
    if(o.state==="chase") chasing=true;
  }
  /* 増援はステージ進行で出す。時間経過の青鬼スポーンはしない */

  /* 交番 */
  const kd=Math.hypot(KOBAN.x-player.x,KOBAN.z-player.z);
  if(!kobanFound && kd<26 && !losBlocked(player.x,player.z,KOBAN.x,KOBAN.z)){
    kobanFound=true; flash("交番を見つけた"); beep(880,0.14,"square",0.07);
  }
  if(kd<4.2 && stageLock<=0){
    if(stage>=STAGES){ clearGame(); return; }
    nextStage();
  }
  if(!hintShown && elapsed>70){ hintShown=true; flash("赤い光をさがせ"); }

  /* HUD */
  el.time.textContent=fmt(elapsed);
  if(el.stageLab) el.stageLab.textContent=stage+" / "+STAGES;
  el.sta.style.width=(player.sta*100)+"%";
  el.pres.style.width=clamp((1-nearest/45)*100,0,100)+"%";
  el.breathRow.style.display=player.hidden?"block":"none";
  el.breath.style.width=(player.breath*100)+"%";
  if(chasing){ el.state.className="chase"; el.state.textContent="● 追跡中！"; el.sub.textContent="逃げろ！物陰へ"; }
  else if(nearest<20){ el.state.className="warn"; el.state.textContent="● 気配"; el.sub.textContent="近くに鬼がいる"; }
  else { el.state.className="safe"; el.state.textContent="● 安全"; el.sub.textContent=kobanFound?"交番へ急げ":"交番をさがせ"; }
  if(player.hidden){ el.sub.textContent="かくれ中（Spaceで出る）"; }
  else if(!chasing && nearHideSpot()){ el.sub.textContent="Space：ここに隠れられる"; }
  syncBgmNear(nearest);

  if(flashT>0){ flashT-=dt; if(flashT<=0) el.hint.style.display="none"; }

  /* 心音 */
  if(nearest<14){
    player._hb=(player._hb||0)-dt;
    if(player._hb<=0){ player._hb=clamp(nearest/14,0.35,1)*0.75; beep(70,0.1,"sine",0.12); }
  }
  drawMap();
}

function render(dt){
  /* カメラ：三人称・建物にめり込まない */
  const fwd=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));
  let d=camDist;
  for(let i=1;i<=8;i++){
    const t=camDist*i/8;
    if(hits(player.x-fwd.x*t, player.z-fwd.z*t, 0.4)){ d=Math.max(2.2,t-0.6); break; }
  }
  const cy=player.hidden?2.2:3.6;
  camera.position.lerp(new THREE.Vector3(player.x-fwd.x*d, cy+1.0, player.z-fwd.z*d), Math.min(1,dt*10||1));
  camera.lookAt(player.x+fwd.x*2, (player.hidden?0.8:1.5), player.z+fwd.z*2);

  /* 交番の赤色灯 */
  const kg=window.__kobanGroup;
  if(kg&&kg.userData.lamp){
    kg.userData.lamp.material.color.setHSL(0.0, 1, 0.45+Math.sin(performance.now()/180)*0.22);
  }
  renderer.render(scene,camera);
}

/* ============================================================
   起動
============================================================ */
resize();
playerMesh.position.set(player.x,0,player.z);
camera.position.set(player.x,4.6,player.z+7);
camera.lookAt(player.x,1.4,player.z);
drawMap();
window.__kitaku={
  snap(){ return {stage:stage, oni:onis.length, colors:onis.map(o=>o.color), kd:Math.hypot(KOBAN.x-player.x,KOBAN.z-player.z), state:state, bgmNear:bgmNear, bgmVol:bgmPlayVol(), oniScale:onis[0]?onis[0].mesh.scale.x:null, oniCatch:ONI_CATCH, oniRadius:ONI_RADIUS}; },
  goNext(){ nextStage(); },
  banner(){ const b=document.getElementById("stageMark"), n=document.getElementById("stageMarkN"); return {show:!!(b&&b.classList.contains("show")), n:n?n.textContent:"", display:b?getComputedStyle(b).display:""}; },
  placeOni(dx,dz){
    const o=onis[0]; if(!o) return null;
    o.x=player.x+dx; o.z=player.z+dz;
    if(o.mesh) o.mesh.position.set(o.x,0,o.z);
    return Math.hypot(dx,dz);
  }
};
requestAnimationFrame(loop);
})();
</script>
